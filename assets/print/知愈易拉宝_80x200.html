<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知愈·Ring 易拉宝 80×200cm</title>
<style>
  /* ============================================================
     知愈·Ring「环抱你」Demo Day 易拉宝
     成品尺寸：80cm × 200cm（竖版）· 出血按送印时可外扩
     导出：浏览器打开 → 打印(Cmd/Ctrl+P) → 目标"另存为PDF"
            纸张选"自定义"或直接截图 SVG 区域导出高清 PNG
     ============================================================ */

  :root{
    /* —— 品牌色板（取自六瓣花玻璃质感） —— */
    --paper:      #F6EFE1;   /* 米白主底 */
    --paper-deep: #EFE4D0;   /* 略深留白层 */
    --gold:       #C8862E;   /* 暖金主色（logo字色） */
    --gold-soft:  #D9A24E;   /* 柔金 */
    --ink:        #4A4038;   /* 暖褐墨（正文） */
    --ink-soft:   #8A7B6B;   /* 次级文字 */
    /* 六瓣花瓣色 */
    --p-peach:  #E9B48F;
    --p-blue:   #A9BBC9;
    --p-lilac:  #C9A9BE;
    --p-amber:  #E4B26A;
    --p-green:  #B8BE94;
    --p-slate:  #9FA9B8;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:#d8d2c4;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:40px 0;
  }

  /* 治愈系宋体：用于主标题与 slogan，比黑体柔和高级 */
  .serif{
    font-family:"Songti SC","STSong","SimSun","Source Han Serif SC","Noto Serif CJK SC",serif;
  }

  /* 屏幕预览用固定像素；真实尺寸由 SVG 的 viewBox(800×2000 = 1:2.5) 保证 */
  .stage{
    width:400px;                 /* 屏幕预览宽度，可缩放 */
    box-shadow:0 30px 90px rgba(0,0,0,.35);
    background:var(--paper);
  }
  svg{ display:block; width:100%; height:auto; }

  /* 打印：铺满整页，去掉阴影和外边距 */
  @media print{
    @page{ size:80cm 200cm; margin:0; }
    html,body{ background:#fff; padding:0; }
    .stage{ width:80cm; box-shadow:none; }
    .hint{ display:none; }
  }
  .hint{
    position:fixed; right:16px; bottom:16px; max-width:260px;
    background:rgba(74,64,56,.92); color:#F6EFE1;
    font-size:12px; line-height:1.6; padding:12px 14px; border-radius:10px;
    font-family:"PingFang SC",sans-serif;
  }
  .hint b{ color:#E4B26A; }
</style>
</head>
<body>

<div class="stage">
<!-- viewBox 800×2000 = 80cm×200cm 等比（1cm=10单位） -->
<svg viewBox="0 0 800 2000" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 主背景：米白纵向柔和渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F8F2E6"/>
      <stop offset="0.5" stop-color="#F6EFE1"/>
      <stop offset="1"   stop-color="#F0E6D4"/>
    </linearGradient>

    <!-- 顶部与底部的暖金光晕 -->
    <radialGradient id="glowTop" cx="0.5" cy="0.0" r="0.9">
      <stop offset="0" stop-color="#FBEBCB" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FBEBCB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="0.5" cy="1.0" r="0.8">
      <stop offset="0" stop-color="#F3D9AE" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F3D9AE" stop-opacity="0"/>
    </radialGradient>

    <!-- 花瓣玻璃渐变（六色，带高光感） -->
    <linearGradient id="gPeach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D2B7"/><stop offset="1" stop-color="#DFA07A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C6D3DD"/><stop offset="1" stop-color="#93A7B6"/>
    </linearGradient>
    <linearGradient id="gLilac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCC2D2"/><stop offset="1" stop-color="#B692A8"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CD93"/><stop offset="1" stop-color="#D69B49"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFD4AC"/><stop offset="1" stop-color="#A3AA7C"/>
    </linearGradient>
    <linearGradient id="gSlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BBC4D0"/><stop offset="1" stop-color="#8B96A6"/>
    </linearGradient>

    <!-- 花瓣高光 -->
    <linearGradient id="petalShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- CTA 暖金按钮渐变 -->
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0AB5C"/>
      <stop offset="1" stop-color="#C58A34"/>
    </linearGradient>

    <!-- 柔和投影 -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B98C4E" flood-opacity="0.28"/>
    </filter>
    <filter id="petalShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#9c7b52" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- ========== 背景 ========== -->
  <rect x="0" y="0" width="800" height="2000" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="700" fill="url(#glowTop)"/>
  <rect x="0" y="1300" width="800" height="700" fill="url(#glowBot)"/>

  <!-- 极淡的呼吸波纹（贯穿全幅的氛围底纹） -->
  <g stroke="#C8862E" stroke-opacity="0.06" fill="none" stroke-width="1.2">
    <circle cx="400" cy="1000" r="360"/>
    <circle cx="400" cy="1000" r="300"/>
    <circle cx="400" cy="1000" r="240"/>
  </g>

  <!-- ============================================================
       ① 顶部品牌区
       ============================================================ -->
  <!-- 六瓣花 logo（矢量重绘，玻璃质感） -->
  <g transform="translate(400,175) scale(1.02)" filter="url(#petalShadow)">
    <!-- 6 片花瓣，围绕中心旋转，每片一个"水滴/拼图"形 -->
    <g id="flower">
      <!-- 单片花瓣路径：一个圆润的桃形，尖端朝中心 -->
      <g transform="rotate(0)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gLilac)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <g transform="rotate(60)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gAmber)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <g transform="rotate(120)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gSlate)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <g transform="rotate(180)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gPeach)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <g transform="rotate(240)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gGreen)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <g transform="rotate(300)">
        <path d="M0,-118 C34,-118 60,-92 60,-58 C60,-30 44,-14 30,-4 C20,3 12,10 0,10 C-12,10 -20,3 -30,-4 C-44,-14 -60,-30 -60,-58 C-60,-92 -34,-118 0,-118 Z"
              fill="url(#gBlue)" stroke="#E8DFCB" stroke-width="3"/>
        <path d="M-30,-98 C-14,-110 14,-110 30,-98 C10,-96 -10,-96 -30,-98 Z" fill="url(#petalShine)"/>
      </g>
      <!-- 花心小圆 -->
      <circle cx="0" cy="0" r="14" fill="#F6EFE1" stroke="#E4B26A" stroke-width="3"/>
    </g>
  </g>

  <!-- 母品牌小字署名（知愈只作背书，不抢主角） -->
  <g transform="translate(400,338)">
    <line x1="-150" y1="0" x2="-58" y2="0" stroke="#D9C7A8" stroke-width="1"/>
    <line x1="58"   y1="0" x2="150" y2="0" stroke="#D9C7A8" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-size="21" font-weight="500"
          fill="#B08A5A" letter-spacing="3">知愈 · Feeling Mosaic 出品</text>
  </g>

  <!-- 产品主标题：环抱你（这次的绝对主角，宋体优雅） -->
  <text x="400" y="456" text-anchor="middle" font-size="108" font-weight="700"
        fill="#BE7F2A" letter-spacing="14" class="serif">环抱你</text>

  <!-- 产品英文/品类副题 -->
  <text x="400" y="506" text-anchor="middle" font-size="25" font-weight="400"
        fill="#8A7B6B" letter-spacing="4">Ring 真系列　·　一枚会呼吸的戒指</text>

  <!-- 分隔小花瓣点 -->
  <g transform="translate(400,540)">
    <circle cx="-24" cy="0" r="3.5" fill="#E9B48F"/>
    <circle cx="0"   cy="0" r="4.5" fill="#C8862E"/>
    <circle cx="24"  cy="0" r="3.5" fill="#A9BBC9"/>
  </g>

  <!-- ============================================================
       ② 主视觉一击 slogan
       ============================================================ -->
  <text x="400" y="614" text-anchor="middle" font-size="68" font-weight="700"
        fill="#463C33" letter-spacing="3" class="serif">用身体的诚实，</text>
  <text x="400" y="708" text-anchor="middle" font-size="68" font-weight="700"
        fill="#463C33" letter-spacing="3" class="serif">接住每一个</text>

  <!-- "说'我没事'的人" —— 暖金强调整行 -->
  <text x="400" y="808" text-anchor="middle" font-size="72" font-weight="700"
        fill="#BE7F2A" letter-spacing="3" class="serif">说「我没事」的人。</text>

  <!-- 副题 -->
  <text x="400" y="886" text-anchor="middle" font-size="30" font-weight="400"
        fill="#8A7B6B" letter-spacing="3">—— 成年人，谁没有强撑过的时刻啊。</text>

  <!-- ============================================================
       ③ 产品价值区
       ============================================================ -->
  <!-- 定位金句：卡片 -->
  <g transform="translate(400,960)">
    <rect x="-330" y="-52" width="660" height="104" rx="24"
          fill="#FFFFFF" fill-opacity="0.55" stroke="#E4C79A" stroke-width="1.5"/>
    <text x="0" y="-8" text-anchor="middle" font-size="28" font-weight="600" fill="#6B5D4E">
      你不是想太多。
    </text>
    <text x="0" y="32" text-anchor="middle" font-size="28" font-weight="600" fill="#6B5D4E">
      是你的身体，一直在替你认真感受这个世界。
    </text>
  </g>

  <!-- 产品图占位框（可替换：你的外壳产品图） -->
  <g transform="translate(400,1180)">
    <rect x="-190" y="-120" width="380" height="240" rx="20"
          fill="#F1E6D2" stroke="#D9A24E" stroke-width="2.5" stroke-dasharray="10 8"/>
    <!-- 内部呼吸波纹意象 -->
    <g stroke="#C8862E" stroke-opacity="0.30" fill="none" stroke-width="2">
      <circle cx="0" cy="-6" r="34"/>
      <circle cx="0" cy="-6" r="58"/>
      <circle cx="0" cy="-6" r="82"/>
    </g>
    <circle cx="0" cy="-6" r="12" fill="#D9A24E" fill-opacity="0.85"/>
    <text x="0" y="82" text-anchor="middle" font-size="22" fill="#B08A5A" letter-spacing="2">
      〔 你的产品图 · 待替换 〕
    </text>
  </g>

  <!-- 三档"环抱" -->
  <g transform="translate(400,1420)">
    <text x="0" y="-70" text-anchor="middle" font-size="32" font-weight="700" fill="#BE7F2A" letter-spacing="4" class="serif">
      它只做一件事 —— 环抱你
    </text>

    <!-- 三个圆点档位（统一白色线描矢量图标） -->
    <g transform="translate(-230,0)">
      <circle cx="0" cy="0" r="44" fill="url(#gPeach)" filter="url(#softShadow)"/>
      <!-- 图标：呼吸波纹（同心弧） -->
      <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.95">
        <circle cx="0" cy="0" r="6"/>
        <path d="M-16,-16 A22,22 0 0,1 16,-16"/>
        <path d="M-24,-6 A30,30 0 0,1 -18,-18"/>
        <path d="M24,-6 A30,30 0 0,0 18,-18"/>
      </g>
      <text x="0" y="88" text-anchor="middle" font-size="25" font-weight="600" fill="#463C33" class="serif">停，先呼吸</text>
      <text x="0" y="118" text-anchor="middle" font-size="18" fill="#8A7B6B">刚绷紧时</text>
    </g>
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="44" fill="url(#gAmber)" filter="url(#softShadow)"/>
      <!-- 图标：手托心（陪伴/接住） -->
      <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.95">
        <path d="M0,-6 C-6,-15 -20,-11 -20,-1 C-20,7 -8,14 0,20 C8,14 20,7 20,-1 C20,-11 6,-15 0,-6 Z"/>
        <path d="M-26,10 C-20,22 20,22 26,10"/>
      </g>
      <text x="0" y="88" text-anchor="middle" font-size="25" font-weight="600" fill="#463C33" class="serif">我在，撑到结束</text>
      <text x="0" y="118" text-anchor="middle" font-size="18" fill="#8A7B6B">不能停时</text>
    </g>
    <g transform="translate(230,0)">
      <circle cx="0" cy="0" r="44" fill="url(#gSlate)" filter="url(#softShadow)"/>
      <!-- 图标：弯月（歇息） -->
      <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-opacity="0.95">
        <path d="M10,-20 A22,22 0 1,0 18,16 A17,17 0 1,1 10,-20 Z"/>
      </g>
      <text x="0" y="88" text-anchor="middle" font-size="25" font-weight="600" fill="#463C33" class="serif">你到极限了</text>
      <text x="0" y="118" text-anchor="middle" font-size="18" fill="#8A7B6B">可以歇了</text>
    </g>
  </g>

  <!-- 差异化一行 -->
  <text x="400" y="1600" text-anchor="middle" font-size="26" font-weight="500" fill="#6B5D4E" letter-spacing="1">
    不监测、不分析 —— 只是<tspan fill="#C8862E" font-weight="700">接住</tspan>你。
  </text>

  <!-- ============================================================
       ④ 行动召唤区
       ============================================================ -->
  <!-- 主 CTA 按钮 -->
  <g transform="translate(400,1710)">
    <rect x="-320" y="-46" width="640" height="92" rx="46" fill="url(#cta)" filter="url(#softShadow)"/>
    <text x="0" y="10" text-anchor="middle" font-size="36" font-weight="700" fill="#FFF8EC" letter-spacing="2" class="serif">
      戴上它，给自己 2 分钟 →
    </text>
  </g>
  <text x="400" y="1792" text-anchor="middle" font-size="24" fill="#8A7B6B" letter-spacing="1">
    感受一次「被身体接住」的那一下。
  </text>

  <!-- 副 CTA：二维码占位 -->
  <g transform="translate(400,1880)">
    <!-- 二维码占位框 -->
    <rect x="-58" y="-40" width="116" height="116" rx="12" fill="#FFFFFF" stroke="#D9A24E" stroke-width="2"/>
    <g stroke="#C8B79A" stroke-width="8" fill="none">
      <path d="M-40,-22 h20 v20"/>
      <path d="M40,-22 h-20 v20"/>
      <path d="M-40,58 h20 v-20"/>
    </g>
    <text x="0" y="22" text-anchor="middle" font-size="15" fill="#B08A5A">二维码</text>
    <text x="0" y="42" text-anchor="middle" font-size="15" fill="#B08A5A">待替换</text>
    <!-- 说明 -->
    <text x="95" y="4"  text-anchor="start" font-size="26" font-weight="700" fill="#C8862E">扫码，遇见小知</text>
    <text x="95" y="42" text-anchor="start" font-size="20" fill="#8A7B6B">把读不准的感受，</text>
    <text x="95" y="70" text-anchor="start" font-size="20" fill="#8A7B6B">翻译成你能懂的话。</text>
  </g>

  <!-- ============================================================
       ⑤ 页脚署名
       ============================================================ -->
  <line x1="200" y1="1950" x2="600" y2="1950" stroke="#D9C7A8" stroke-width="1"/>
  <text x="400" y="1978" text-anchor="middle" font-size="20" fill="#9A8A72" letter-spacing="2">
    Jiayi　·　Buildathon 2026　·　Next World 赛道
  </text>

</svg>
</div>

<div class="hint">
  <b>预览中</b>　真实尺寸 80×200cm<br>
  导出：<b>Cmd/Ctrl + P</b> → 目标选「另存为 PDF」，纸张 80×200cm<br>
  或用截图工具截取画面导出 PNG 送印。<br>
  占位框（产品图 / 二维码）把图给我即可替换。
</div>

</body>
</html>
