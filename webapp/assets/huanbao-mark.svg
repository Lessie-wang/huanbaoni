<svg width="72" height="64" viewBox="0 0 72 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="环抱你">
  <defs>
    <linearGradient id="hbWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#E6C9B4"/>
      <stop offset="55%" stop-color="#D4B8A5"/>
      <stop offset="100%" stop-color="#B89A83"/>
    </linearGradient>
  </defs>
  <!-- 两片柔弧相向环抱：合成一个心 / 留空的圆（呼应戒指），端点圆润 -->
  <g fill="none" stroke="url(#hbWarm)" stroke-width="5.2" stroke-linecap="round">
    <!-- 左臂 -->
    <path d="M36 51 C 20 42, 13 30, 18 21 C 22 13, 32 13, 36 22"/>
    <!-- 右臂（镜像相拥成心尖） -->
    <path d="M36 51 C 52 42, 59 30, 54 21 C 50 13, 40 13, 36 22"/>
  </g>
  <!-- 心口一点柔光：被接住的那一下 -->
  <circle cx="36" cy="25" r="2.3" fill="#E6C9B4" opacity="0.92"/>
</svg>
