<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>知愈·Ring 环抱你</title>
  <link rel="stylesheet" href="lib/tokens.css" />
  <style>
    /* ── 桌面/投屏：把 app 框进一台手机；真机打开自动全屏 ── */
    body{ background:#E9E4DE; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .device{
      position:relative;
      width:390px; height:844px; margin:20px auto; flex:none;
      border-radius:46px; overflow:hidden;
      background:
        radial-gradient(120% 55% at 50% -8%, rgba(232,214,199,.5), transparent 60%),
        radial-gradient(90% 45% at 100% 102%, rgba(168,192,176,.12), transparent 55%),
        var(--bg);
      box-shadow:0 34px 90px rgba(58,53,47,.28), 0 0 0 11px #201d19, 0 0 0 12px #3a352f;
      transform:translateZ(0);   /* 让内部 fixed 元素相对手机框定位 */
    }
    /* 顶部灵动岛/刘海 */
    .device .notch{ position:absolute; top:11px; left:50%; transform:translateX(-50%);
      width:112px; height:30px; background:#201d19; border-radius:18px; z-index:50; }
    /* demo 状态栏 */
    .statusbar{ position:absolute; top:0; left:0; right:0; height:52px; z-index:45;
      display:flex; align-items:flex-end; justify-content:space-between;
      padding:0 26px 6px; font-size:14px; font-weight:600; color:var(--ink);
      font-variant-numeric:tabular-nums; pointer-events:none; }
    .statusbar .sb-right{ display:flex; align-items:center; gap:6px; }
    .statusbar .sb-right svg{ display:block; }
    .screen{ position:absolute; inset:0; padding-top:52px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .screen::-webkit-scrollbar{ display:none; }

    @media (max-width:480px){
      body{ background:var(--bg); display:block; }
      .device{ width:100%; height:100dvh; height:100vh; margin:0; border-radius:0; box-shadow:none; }
      .device .notch{ display:none; }
      .statusbar{ display:none; }
      .screen{ padding-top:0; }
    }

    #app { margin: 0 auto; min-height: 100%; padding: 12px 16px 96px; }

    /* ── 顶栏 ── */
    .topbar { display:flex; align-items:center; gap:11px; padding: 8px 2px 16px; }
    .topbar .mark { width:40px; height:36px; display:block; flex:none; }
    .topbar .brand { display:flex; flex-direction:column; line-height:1.15; }
    .topbar .brand .mother { font-size:11px; color:var(--sub); letter-spacing:3px; font-weight:500; }
    .topbar .brand h1 { font-family:var(--font-serif); font-size:21px; margin:1px 0 0; font-weight:600; letter-spacing:2px; color:var(--ink); }
    .topbar .gear { margin-left:auto; background:transparent; color:var(--sub); padding:6px; display:flex; }

    /* ── 底部导航：5 tab，环抱居中凸起 ── */
    .tabbar {
      position:absolute; left:0; right:0; bottom:0; height:64px;
      background:rgba(255,255,255,.86); backdrop-filter:blur(14px);
      border-top:1px solid var(--line);
      display:flex; align-items:stretch; z-index:30;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tabbar .tab {
      flex:1; background:transparent; color:var(--sub); border-radius:0;
      font-size:11px; letter-spacing:.5px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      padding:8px 0; transition:color .25s var(--ease-calm);
    }
    .tabbar .tab svg { width:23px; height:23px; stroke:currentColor; fill:none;
      stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; transition:transform .25s var(--ease-calm); }
    .tabbar .tab.active { color:var(--accent-deep); }
    .tabbar .tab.active svg { transform:translateY(-1px); }

    /* 环抱中心凸起主按钮 */
    .tabbar .tab-center { flex:0 0 76px; position:relative; overflow:visible; }
    .tabbar .tab-center .fab {
      position:absolute; top:-24px; left:50%; transform:translateX(-50%);
      width:60px; height:60px; border-radius:50%;
      background:linear-gradient(145deg,#E6C9B4,#C4A893);
      box-shadow:var(--shadow-lift);
      display:flex; align-items:center; justify-content:center;
      transition:transform .2s var(--ease-calm);
    }
    .tabbar .tab-center .fab svg { width:30px; height:30px; stroke:#fff; stroke-width:1.7; }
    .tabbar .tab-center:active .fab { transform:translateX(-50%) scale(.94); }
    .tabbar .tab-center .clabel { position:absolute; bottom:7px; left:0; right:0; text-align:center;
      font-size:11px; letter-spacing:1px; color:var(--accent-deep); font-weight:600; }
    .tabbar .tab-center.active .fab { box-shadow:0 12px 32px rgba(184,154,131,.32); }

    /* ── 小知浮窗（环抱主页悬浮）── */
    #xiaozhiFab {
      position:absolute; right:18px; bottom:88px; z-index:35;
      width:54px; height:54px; border-radius:50%;
      background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
      box-shadow:var(--shadow-lift); padding:0;
      display:none; align-items:center; justify-content:center;
    }
    #xiaozhiFab svg { width:30px; height:30px; }
    #xiaozhiFab .tip { position:absolute; right:64px; white-space:nowrap;
      background:var(--ink); color:#fff; font-size:12px; padding:5px 10px; border-radius:12px;
      opacity:0; transform:translateX(6px); transition:.25s var(--ease-calm); pointer-events:none; }
    #xiaozhiFab .breathe-dot { position:absolute; top:6px; right:7px; width:7px; height:7px;
      border-radius:50%; background:var(--calm); animation:haloPulse 4s var(--ease-calm) infinite; }

    /* ── 小知对话 overlay ── */
    #chatOverlay {
      position:absolute; inset:0; z-index:60; display:none;
      background:rgba(58,53,47,.28); backdrop-filter:blur(3px);
    }
    #chatOverlay.open { display:block; }
    #chatSheet {
      position:absolute; left:0; bottom:0; transform:translateY(100%);
      width:100%; height:92%;
      background:var(--bg); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow:0 -12px 40px rgba(58,53,47,.18);
      transition:transform .34s var(--ease-calm); overflow:hidden;
      display:flex; flex-direction:column;
    }
    #chatOverlay.open #chatSheet { transform:translateY(0); }
    #chatSheet .sheet-head {
      display:flex; align-items:center; gap:10px; padding:14px 18px 10px; flex:none;
      border-bottom:1px solid var(--line);
    }
    #chatSheet .sheet-head .grip { position:absolute; top:7px; left:50%; transform:translateX(-50%);
      width:38px; height:4px; border-radius:2px; background:var(--line); }
    #chatSheet .sheet-head .zname { font-family:var(--font-serif); font-size:17px; font-weight:600; letter-spacing:1px; }
    #chatSheet .sheet-head .zsub { font-size:11px; color:var(--sub); }
    #chatSheet .sheet-head .xclose { margin-left:auto; background:transparent; color:var(--sub); padding:6px; display:flex; }
    #chatSheet .sheet-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #chatSheet .sheet-body .chat-wrap { height:auto !important; min-height:100%; }

    .placeholder { text-align:center; color:var(--sub); padding:60px 20px; }
    .placeholder .em { font-size:40px; }

    dialog.settings { border:none; border-radius:var(--radius); padding:22px; width:300px; box-shadow:var(--shadow); }
    dialog.settings input { width:100%; padding:10px; margin:6px 0 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
    dialog.settings label { font-size:13px; color:var(--sub); }
    dialog.settings h3 { margin:0 0 14px; }
  </style>
</head>
<body>
  <!-- ── 内联 SVG 图标库（细线描边，currentColor 染色）── -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 环抱：双臂环抱成心 -->
      <symbol id="ic-huanbao" viewBox="0 0 24 24">
        <path d="M12 19 C 6.5 15.5, 4 11.5, 5.6 8.2 C 6.9 5.5, 10.6 5.6, 12 8.4 C 13.4 5.6, 17.1 5.5, 18.4 8.2 C 20 11.5, 17.5 15.5, 12 19 Z"/>
      </symbol>
      <!-- 心灵画像：画框里的柔和抽象 -->
      <symbol id="ic-portrait" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="4"/>
        <path d="M4 15 C 8 11, 10 14, 13 12 C 16 10, 18 13, 20 12"/>
        <circle cx="15" cy="8.5" r="1.4"/>
      </symbol>
      <!-- 心迹：轨迹曲线 + 节点 -->
      <symbol id="ic-growth" viewBox="0 0 24 24">
        <path d="M4 17 C 8 17, 8 8, 12 8 C 16 8, 16 14, 20 14"/>
        <circle cx="4" cy="17" r="1.3"/>
        <circle cx="12" cy="8" r="1.3"/>
        <circle cx="20" cy="14" r="1.3"/>
      </symbol>
      <!-- 探索：指南针/星 -->
      <symbol id="ic-tests" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8"/>
        <path d="M12 4.5 C 12.8 9.5, 14.5 11.2, 19.5 12 C 14.5 12.8, 12.8 14.5, 12 19.5 C 11.2 14.5, 9.5 12.8, 4.5 12 C 9.5 11.2, 11.2 9.5, 12 4.5 Z"/>
      </symbol>
      <!-- 修习：柔和笔 -->
      <symbol id="ic-training" viewBox="0 0 24 24">
        <path d="M16.5 4.5 L 19.5 7.5 L 9 18 L 5 19 L 6 15 Z"/>
        <path d="M14.5 6.5 L 17.5 9.5"/>
      </symbol>
      <!-- 小知：柔和云 + 一点光 -->
      <symbol id="ic-xiaozhi" viewBox="0 0 24 24">
        <path d="M7.5 17 C 5 17, 3.5 15.2, 3.5 13.2 C 3.5 11.3, 5 10, 6.7 10 C 6.9 7.4, 9 5.6, 11.6 5.6 C 14 5.6, 16 7.2, 16.4 9.6 C 18.4 9.7, 20 11.2, 20 13.3 C 20 15.4, 18.3 17, 16 17 Z"/>
      </symbol>
    </defs>
  </svg>

  <div class="device">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="sbTime">9:41</span>
      <span class="sb-right">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 2.4c2 0 3.8.8 5.1 2.1l1.3-1.3C13.7 1.5 11 .4 8 .4S2.3 1.5.6 3.2l1.3 1.3C3.2 3.2 6 2.4 8 2.4z" opacity=".9"/><path d="M8 6c1 0 1.9.4 2.6 1.1l1.3-1.3C10.8 4.7 9.5 4.1 8 4.1s-2.8.6-3.9 1.7l1.3 1.3C6.1 6.4 7 6 8 6z"/><circle cx="8" cy="9.4" r="1.4"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>
    <div class="screen">
  <div id="app">
    <div class="topbar">
      <img class="mark" src="assets/huanbao-mark.svg" alt="环抱你" />
      <div class="brand">
        <span class="mother">知愈</span>
        <h1>环抱你</h1>
      </div>
      <button class="gear" onclick="openSettings()" aria-label="设置">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7 5.6 5.6"/></svg>
      </button>
    </div>
    <main id="view"></main>
  </div>
    </div><!-- /.screen -->

  <!-- 小知浮窗（仅环抱主页显示） -->
  <button id="xiaozhiFab" onclick="openChat()" aria-label="和小知聊聊">
    <span class="breathe-dot"></span>
    <svg viewBox="0 0 24 24" stroke="var(--accent-deep)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-xiaozhi"/></svg>
    <span class="tip">和小知聊聊</span>
  </button>

  <!-- 底部导航 -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- 小知对话 overlay -->
  <div id="chatOverlay" onclick="if(event.target===this)closeChat()">
    <div id="chatSheet">
      <div class="sheet-head">
        <span class="grip"></span>
        <svg width="30" height="30" viewBox="0 0 24 24" stroke="var(--accent-deep)" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-xiaozhi"/></svg>
        <div>
          <div class="zname">小知</div>
          <div class="zsub">带证据的当天证人 · 我在</div>
        </div>
        <button class="xclose" onclick="closeChat()" aria-label="收起">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="chatBody"></div>
    </div>
  </div>
  </div><!-- /.device -->

  <dialog class="settings" id="settingsDlg">
    <h3>设置</h3>
    <label>官方 API Base URL</label>
    <input id="setBase" placeholder="https://.../v1" />
    <label>API Key</label>
    <input id="setKey" placeholder="sk-..." />
    <label><input type="checkbox" id="setMock" style="width:auto;margin-right:6px" />使用 mock 假数据（无戒指时开发/演示）</label>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="ghost" style="flex:1" onclick="settingsDlg.close()">取消</button>
      <button style="flex:1" onclick="saveSettings()">保存</button>
    </div>
  </dialog>

  <!-- 共享契约层 -->
  <script src="lib/markdown.js"></script>
  <script src="lib/knowledge.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/ai.js"></script>
  <script src="lib/emotions.js"></script>
  <script src="lib/audiostore.js"></script>
  <script src="lib/imagestore.js"></script>
  <script src="lib/mock.js"></script>
  <script src="lib/ble.js"></script>

  <!-- 页面模块：每个由一个 agent 独立实现，注册到 window.Pages[name] = { render(el) } -->
  <script>window.Pages = window.Pages || {};</script>
  <script src="pages/realtime.js"></script>
  <script src="pages/portrait.js"></script>
  <script src="pages/growth.js"></script>
  <script src="pages/chat.js"></script>
  <script src="pages/tests.js"></script>
  <script src="pages/training.js"></script>

  <script>
    // 全局戒指实例（默认 mock；硬件通了在设置里关掉 mock 并启用 BleRing）
    const USE_MOCK = (Store.getSettings().useMock !== false);
    window.ring = USE_MOCK ? new MockRing() : (window.BleRing ? new BleRing() : new MockRing());

    // AI 从设置读取配置
    AI.loadFromStore();

    // demo 状态栏时钟
    (function tickClock(){
      const t = document.getElementById('sbTime');
      if (t) { const d = new Date(); t.textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
      setTimeout(tickClock, 30000);
    })();

    // ---- 底部 5 tab（环抱居中凸起；小知不占 tab，走浮窗）----
    const TABS = [
      { key:'portrait', label:'心灵画像', icon:'ic-portrait' },
      { key:'growth',   label:'心迹',     icon:'ic-growth' },
      { key:'realtime', label:'环抱',     icon:'ic-huanbao', center:true },
      { key:'tests',    label:'探索',     icon:'ic-tests' },
      { key:'training', label:'修习',     icon:'ic-training' },
    ];
    const tabbar = document.getElementById('tabbar');
    const view = document.getElementById('view');
    const xiaozhiFab = document.getElementById('xiaozhiFab');

    function svgIcon(id){ return `<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`; }

    function renderTabs(active) {
      tabbar.innerHTML = '';
      TABS.forEach(t => {
        const b = document.createElement('button');
        const on = (t.key === active);
        if (t.center) {
          b.className = 'tab tab-center' + (on ? ' active' : '');
          b.innerHTML = `<span class="fab">${svgIcon(t.icon)}</span><span class="clabel">${t.label}</span>`;
        } else {
          b.className = 'tab' + (on ? ' active' : '');
          b.innerHTML = `${svgIcon(t.icon)}<span>${t.label}</span>`;
        }
        b.onclick = () => { location.hash = t.key; };
        tabbar.appendChild(b);
      });
    }

    function route() {
      const key = (location.hash.replace('#','') || 'realtime');
      // 若旧链接指向 chat，重定向为环抱 + 打开浮窗对话
      if (key === 'chat') { location.hash = 'realtime'; setTimeout(openChat, 60); return; }
      renderTabs(key);
      // 小知浮窗只在环抱主页出现
      xiaozhiFab.style.display = (key === 'realtime') ? 'flex' : 'none';
      view.innerHTML = '';
      const page = window.Pages[key];
      if (page && typeof page.render === 'function') {
        try { page.render(view); }
        catch (e) { view.innerHTML = `<div class="placeholder"><div class="em">⚠️</div>${key} 渲染出错：${e.message}</div>`; }
      } else {
        const label = (TABS.find(t=>t.key===key)||{}).label || key;
        view.innerHTML = `<div class="placeholder"><div class="em">🌱</div>「${label}」模块待开发<br><small class="muted">由对应 agent 实现 pages/${key}.js</small></div>`;
      }
    }
    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', route);
    route();

    // ---- 小知对话 overlay ----
    const chatOverlay = document.getElementById('chatOverlay');
    const chatBody = document.getElementById('chatBody');
    let chatRendered = false;
    function openChat() {
      if (!chatRendered && window.Pages.chat && typeof window.Pages.chat.render === 'function') {
        try { window.Pages.chat.render(chatBody); chatRendered = true; }
        catch (e) { chatBody.innerHTML = `<div class="placeholder"><div class="em">⚠️</div>小知加载出错：${e.message}</div>`; }
      }
      chatOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeChat() {
      chatOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    window.openChat = openChat;
    window.closeChat = closeChat;

    // ---- 设置弹窗 ----
    const settingsDlg = document.getElementById('settingsDlg');
    function openSettings() {
      const s = Store.getSettings();
      setBase.value = s.apiBaseUrl || '';
      setKey.value = s.apiKey || '';
      setMock.checked = (s.useMock !== false);
      settingsDlg.showModal();
    }
    function saveSettings() {
      Store.setSettings({ apiBaseUrl: setBase.value.trim(), apiKey: setKey.value.trim(), useMock: setMock.checked });
      AI.loadFromStore();
      settingsDlg.close();
      alert('已保存。刷新页面生效（切换 mock/真戒指需刷新）。');
    }
  </script>
</body>
</html>
